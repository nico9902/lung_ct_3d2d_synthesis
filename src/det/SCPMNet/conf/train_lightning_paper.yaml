# SCPM-Net paper-style hyperparameters.
#
# Values taken from the SCPM-Net paper:
# - input patch: 96 x 96 x 96
# - 170 epochs
# - SGD, momentum 0.9, weight decay 1e-4
# - batch size 24
# - LR 1e-4 for first 20 warmup epochs, then 1e-2, 1e-3, 1e-4 after epochs 20/80/150
# - CPM K=7 positive points and OHEM n=100
# - re-focal alpha=0.375, gamma=2, threshold t=0.9, weight w=4
# - radius smooth-L1 beta=1/9
# - sphere loss weight lambda_s=2

csv_path: /ssd2/domenico/datasets/lidc_process/lidc_labels.csv
data_root: /ssd2/domenico/datasets/lidc_process
output_dir: outputs/scpmnet
experiment_name: scpmnet_paper

seed: 233
batch_size: 24
num_workers: 8
max_epochs: 170
accelerator: auto
devices: auto
precision: "32"
log_every_n_steps: 10
accumulate_grad_batches: 1
num_sanity_val_steps: 0
check_val_every_n_epoch: 1
checkpoint: null
test_only: false
monitor_finite_values: false
finite_monitor_check_logged_metrics: true
finite_monitor_check_gradients: true
finite_monitor_every_n_train_steps: 1
detect_anomaly: false
gradient_clip_val: 0.0
gradient_clip_algorithm: norm
checkpoint_monitor: val/loss
checkpoint_mode: min
checkpoint_filename: epoch={epoch:03d}-val_loss={val/loss:.4f}
checkpoint_every_n_epochs: null
checkpoint_start_epoch: 1
val_froc_start_epoch: null
val_froc_before_start_every_n_epoch: null

use_wandb: true
wandb_project: lung_ct_3d2d_synthesis_detection
wandb_name: null
wandb_entity: null
wandb_mode: online
wandb_save_dir: wandb2
wandb_log_model: false

crop_size:
  - 96
  - 96
  - 96
samples_per_volume: 1
clip:
  - -1000.0
  - 400.0
intensity_mode: hu
normalized_volume_cache_dir: null
positive_crop_prob: 0.7
mask_path_column: null
skip_missing_images: true
val_full_volume: false
val_modes: []
val_fixed_crop_seed: null
val_random_crop_samples_per_volume: 1
test_full_volume: true
sliding_window_stride:
  - 24
  - 24
  - 24

lr: 0.01
weight_decay: 0.0001
optimizer_name: sgd
momentum: 0.9
warmup_epochs: 20
warmup_lr: 0.0001
lr_milestones:
  - 80
  - 150
lr_gamma: 0.1

stride: 2
positive_topk: 7
positive_radius_factor: 0.6
neg_pos_ratio: 100
focal_gamma: 2.0
refocal_threshold: 0.9
refocal_weight: 4.0
smooth_l1_beta: 0.1111111111111111

lambda_cls: 1.0
lambda_radius: 0.375
lambda_offset: 0.375
lambda_siou: 0.75
using_sac: false

decode_threshold: 0.2
decode_topk: 100
nms_threshold: 0.05
final_topk: 100
evaluate_froc: true
evaluate_val_froc: null
evaluate_test_froc: null
froc_match_strategy: center_distance
froc_iou_threshold: 0.1
froc_fp_rates:
  - 0.125
  - 0.25
  - 0.5
  - 1.0
  - 2.0
  - 4.0
  - 8.0

hydra:
  run:
    dir: ${output_dir}/${experiment_name}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false

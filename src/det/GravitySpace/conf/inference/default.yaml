# Inference / qualitative output options

distance: 8
nms_box_radius: 8
nms_z_radius: 1
nms_2d_iou_threshold: 0.5
nms_3d_iou_threshold: 0.1
score_threshold: 0.0
# FROC x-axis normalization. Use "slice" for the historical behavior,
# "scan" for false positives per CT scan, or "both" to save both curves.
froc_normalization: slice
save_qualitative: false
qualitative_max_images: 10
qualitative_dir: null
qualitative_only_with_findings: true
# Gravity-point plots keep every candidate before invalid filtering, NMS, and score thresholding.
qualitative_max_fp: 30
qualitative_score_threshold: null
qualitative_show_fp_text: false

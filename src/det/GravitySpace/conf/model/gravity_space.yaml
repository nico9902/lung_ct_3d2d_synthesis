# Model Parameters for GravitySpaceAttentionNet
backbone: "ResNet-18"
pretrained: true
attention: "enhanced"
window_size: 5
sampling: 5
hidden_dim: 512
lr: 1e-4

# Feature Extraction (chunking to reduce peak memory)
# chunk_size: Integer > 0 = Process slices in chunks (V100/V100 16GB optimized)
# chunk_size: null = Process all slices at once (A100/80GB optimized, faster)
# Default: 100 for memory efficiency, set to null for speed on large memory GPUs
chunk_size: null

# Anchor Configuration
anchor_config: "grid-10"

# Loss Parameters
loss:
  alpha: 0.25
  gamma: 2.0
  hook: 10
  hook_gap: 5

# Checkpoint path for resuming training or testing
ckpt: null
